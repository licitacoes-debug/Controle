<!DOCTYPE html>
<html>
<head>
  <title>LicitaPro</title>
</head>
<body>

<h2>Cadastro de Licitação</h2>

<input id="codigo" placeholder="Código"><br><br>
<input id="orgao" placeholder="Órgão"><br><br>
<input id="produto" placeholder="Produto"><br><br>
<input id="valor" placeholder="Valor"><br><br>

<button onclick="salvar()">Salvar</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://hqtmocaiwzjgrdughtie.supabase.co",
  "sb_publishable_HogYwBa2e6q74cWyXiImeA_9vKXV_tM"
);

async function salvar() {
  const codigo = document.getElementById('codigo').value;
  const orgao = document.getElementById('orgao').value;
  const produto = document.getElementById('produto').value;
  const valor = document.getElementById('valor').value;

  const { error } = await supabaseClient
    .from('licitacoes')
    .insert([
      {
        codigo: codigo,
        orgao: orgao,
        produto: produto,
        valor_estimado: Number(valor)
      }
    ]);

  if (error) {
    alert("Erro: " + error.message);
  } else {
    alert("Salvo com sucesso!");
  }
}
</script>

</body>
</html>
