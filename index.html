<!DOCTYPE html>
<html>
<head>
  <title>LicitaPro</title>
</head>
<body>

<h2>Cadastro de Licitação</h2>

<input id="codigo" placeholder="Código"><br><br>
<input id="orgao" placeholder="Órgão"><br><br>
<input id="produto" placeholder="Produto"><br><br>
<input id="valor" placeholder="Valor"><br><br>

<button onclick="salvar()">Salvar</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabase = supabase.createClient(
  "https://hqtmocaiwzjgrdughtie.supabase.co/rest/v1/",
  "hqtmocaiwzjgrdughtie"
);

async function salvar() {
  const codigo = document.getElementById('codigo').value;
  const orgao = document.getElementById('orgao').value;
  const produto = document.getElementById('produto').value;
  const valor = document.getElementById('valor').value;

  const { data, error } = await supabase
    .from('licitacoes')
    .insert([
      { codigo, orgao, produto, valor_estimado: valor }
    ]);

  if (error) {
    alert("Erro: " + error.message);
  } else {
    alert("Salvo com sucesso!");
  }
}
</script>

</body>
</html>
