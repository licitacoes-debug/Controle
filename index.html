<!DOCTYPE html>
<html>
<head>
  <title>LicitaPro</title>
</head>
<body>

<h2>Cadastro de Licitação</h2>

<input id="codigo" placeholder="Código"><br><br>
<input id="orgao" placeholder="Órgão"><br><br>
<input id="produto" placeholder="Produto"><br><br>
<input id="valor" placeholder="Valor"><br><br>

<button onclick="salvar()">Salvar</button>

<hr>

<h2>Licitações cadastradas</h2>
<div id="lista"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://hqtmocaiwzjgrdughtie.supabase.co",
  "sb_publishable_HogYwBa2e6q74cWyXiImeA_9vKXV_tM"
);

async function salvar() {
  const codigo = document.getElementById('codigo').value;
  const orgao = document.getElementById('orgao').value;
  const produto = document.getElementById('produto').value;
  const valor = document.getElementById('valor').value;

  const { error } = await supabaseClient
    .from('licitacoes')
    .insert([
      {
        codigo: codigo,
        orgao: orgao,
        produto: produto,
        valor_estimado: Number(valor)
      }
    ]);

  if (error) {
    alert("Erro: " + error.message);
  } else {
    alert("Salvo com sucesso!");
    document.getElementById('codigo').value = "";
    document.getElementById('orgao').value = "";
    document.getElementById('produto').value = "";
    document.getElementById('valor').value = "";
    listar();
  }
}

async function listar() {
  const { data, error } = await supabaseClient
    .from('licitacoes')
    .select('*')
    .order('id', { ascending: false });

  if (error) {
    document.getElementById('lista').innerHTML = "Erro ao carregar: " + error.message;
    return;
  }

  let html = "";

  data.forEach(item => {
    html += `
      <div style="border:1px solid #ccc; padding:10px; margin:10px 0;">
        <strong>${item.codigo}</strong><br>
        Órgão: ${item.orgao}<br>
        Produto: ${item.produto}<br>
        Valor: R$ ${item.valor_estimado}
      </div>
    `;
  });

  document.getElementById('lista').innerHTML = html;
}

listar();
</script>

</body>
</html>
